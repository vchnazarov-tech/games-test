<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Открытие сезона — демо лайв-викторины</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #edeef0;
    font-family: 'Roboto', sans-serif;
    display: flex;
    justify-content: center;
    padding: 84px 16px 24px;
  }

  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 10;
    width: 100%;
    height: 60px;
    background: #FFE5EA;
    display: flex;
    align-items: center;
    padding: 0 24px;
  }

  .site-logo {
    display: flex;
    align-items: center;
    width: 52px;
    height: 52px;
  }

  /* Карточка */
  .post-card {
    width: 640px;
    max-width: 100%;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
  }

  .post-inner {
    padding: 0 24px;
  }

  /* Шапка */
  .post-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0 12px;
  }

  .author-block {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Аватар с градиентом */
  .avatar-wrap {
    position: relative;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
  }

  .avatar-main {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: conic-gradient(
      from 90deg,
      #6ed0ff 0deg,
      #61a1ff 42deg,
      #9d70ff 89deg,
      #ff60c7 137deg,
      #ff483e 180deg,
      #ff9400 223deg,
      #ffde48 270deg,
      #7ae632 306deg,
      #6fd1ff 359deg,
      #6ed0ff 360deg
    );
    outline: 1px solid rgba(0,0,0,0.10);
    outline-offset: -1px;
  }

  /* vc.ru-бейдж */
  .avatar-badge {
    position: absolute;
    bottom: -2px;
    right: -4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #1693E5;
    border: 2px solid #fff;
  }

  .author-info {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .author-name-row {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .author-name {
    font-size: 15px;
    font-weight: 500;
    color: #000;
    line-height: 22px;
  }

  .author-name-badge {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .author-name-badge-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .reaction-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  .reaction-icon-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }


  .author-meta {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .author-section {
    font-size: 13px;
    font-weight: 400;
    color: #000;
    line-height: 18px;
  }

  .author-time {
    font-size: 13px;
    color: #595959;
    line-height: 18px;
  }

  /* Кнопки справа */
  .header-actions {
    display: flex;
    align-items: center;
  }

  .btn-subscribe {
    font-family: 'Roboto', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #000;
    background: #F4F4F4;
    border: none;
    border-radius: 8px;
    padding: 5px 10px;
    height: 28px;
    cursor: pointer;
    line-height: 18px;
  }
  .btn-subscribe:hover { background: #e8e8e8; }

  .btn-more {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 50%;
    padding: 9px 8px;
  }
  .btn-more:hover { background: #f4f4f4; }

  /* Заголовок */
  .post-title-row {
    padding-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .post-title {
    font-size: 22px;
    font-weight: 500;
    color: #000;
    line-height: 30px;
  }

  /* Контент-блок */
  .post-content {
    width: 100%;
    height: 592px;
    background: #fff;
    border-radius: 10px;
    position: relative;
    margin-bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    container-type: inline-size;
    overflow: hidden;
  }

  .post-content::after {
    content: '';
    position: absolute;
    inset: 0;
    border: 1px solid rgba(0,0,0,0.10);
    border-radius: inherit;
    pointer-events: none;
    z-index: 2;
  }

  /* Первый экран продовой викторины DTF: локальная копия для демо. */
  .quiz-shell {
    --quiz-bg: #fff;
    --quiz-text: #000;
    --quiz-text-secondary: #595959;
    --quiz-btn-bg: #f2f2f2;
    --quiz-btn-hover: #e5e5e5;
    --quiz-btn-active: #dbdbdb;
    --quiz-btn-text: #000;
    background: var(--quiz-bg);
    border-radius: 10px;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 40px;
    width: 100%;
    height: 592px;
    padding: 32px;
    font-family: 'Roboto', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    position: relative;
  }

  .quiz-screen {
    flex-direction: column;
    flex: 1;
    align-items: center;
    gap: 40px;
    width: 100%;
    min-height: 0;
    display: flex;
    position: relative;
  }

  .quiz-question-header {
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin: auto auto 0;
    display: flex;
    position: relative;
  }

  .quiz-counter {
    color: var(--quiz-text-secondary);
    text-align: center;
    font-size: 17px;
    font-weight: 400;
    line-height: 24px;
  }

  .quiz-question {
    color: var(--quiz-text);
    text-align: center;
    word-break: break-word;
    margin: 0;
    font-size: 22px;
    font-weight: 500;
    line-height: 30px;
  }

  .quiz-options {
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    width: 100%;
    display: grid;
  }

  .quiz-option {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    width: 100%;
    color: var(--quiz-btn-text);
    background: var(--quiz-btn-bg);
    word-break: break-word;
    border: none;
    border-radius: 10px;
    justify-content: center;
    align-items: center;
    gap: 6px;
    padding: 20px 12px;
    font-family: 'Roboto', sans-serif;
    font-size: 17px;
    font-weight: 500;
    line-height: 24px;
    transition: background 0.123s linear;
    display: flex;
  }

  @media (hover: hover) {
    .quiz-option:hover { background: var(--quiz-btn-hover); }
  }

  .quiz-option:active { background: var(--quiz-btn-active); }
  .quiz-option:focus-visible { outline: 2px solid #0b5dd7; outline-offset: 3px; }

  .quiz-stats {
    text-align: center;
    color: var(--quiz-text);
    margin: 0 0 auto;
    font-size: 15px;
    font-weight: 400;
    line-height: 22px;
  }

  @container (max-width: 591px) {
    .quiz-shell { border-radius: 0; gap: 24px; padding: 16px; }
    .quiz-screen { gap: 24px; }
    .quiz-question-header { gap: 6px; margin: auto 0 0; }
    .quiz-question { font-size: 20px; line-height: 28px; }
    .quiz-options { grid-template-columns: 1fr; gap: 16px; }
    .quiz-option { padding: 16px 12px; font-size: 15px; line-height: 22px; }
  }

  /* 5 секунд сбора участников; ответ и общий сбор идут 12 секунд, затем раскрытие 5 секунд. */
  .demo-page { width: 640px; max-width: 100%; }
  .quiz-screen[hidden], .quiz-shell [hidden] { display: none; }
  .quiz-transition-overlay {
    position: absolute;
    inset: 0;
    margin: 0;
    pointer-events: none;
    z-index: 1;
  }
  .quiz-lobby, .quiz-finale {
    width: 100%;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    display: flex;
    text-align: center;
  }
  .quiz-lobby-title, .quiz-finale-title {
    font-size: 22px;
    font-weight: 500;
    line-height: 30px;
    color: var(--quiz-text);
  }
  .quiz-lobby-time {
    color: var(--quiz-text);
    font-size: 56px;
    font-weight: 500;
    line-height: 64px;
    font-variant-numeric: tabular-nums;
  }
  .quiz-lobby-players {
    display: flex;
    flex-direction: column;
    gap: 4px;
    color: var(--quiz-text-secondary);
    font-size: 15px;
    line-height: 22px;
  }
  .quiz-lobby-players strong {
    color: var(--quiz-text);
    font-size: 28px;
    font-weight: 500;
    line-height: 36px;
    font-variant-numeric: tabular-nums;
    display: flex;
    justify-content: center;
  }
  .quiz-counter-digit {
    display: block;
    width: 0.62em;
    height: 36px;
    overflow: hidden;
  }
  .quiz-counter-reel {
    display: flex;
    flex-direction: column;
    transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .quiz-counter-reel span { display: block; height: 36px; flex-shrink: 0; }
  .quiz-timer {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .quiz-shell[data-phase="reveal"] .quiz-timer { visibility: hidden; }
  .quiz-timer-track { height: 4px; flex: 1; background: #f4f4f4; border-radius: 3px; overflow: hidden; }
  .quiz-timer-bar { width: 100%; height: 100%; background: #30b03d; transform-origin: left; }
  .quiz-timer-time {
    font-size: 15px;
    font-weight: 400;
    line-height: 22px;
    color: var(--quiz-text-secondary);
    font-variant-numeric: tabular-nums;
    min-width: 36px;
    text-align: right;
  }
  .quiz-option { position: relative; overflow: hidden; min-height: 64px; }
  .quiz-option:disabled { cursor: default; opacity: 1; }
  .quiz-option:disabled:hover { background: var(--quiz-btn-bg); }
  .quiz-option.is-selected { box-shadow: inset 0 0 0 2px #0b5dd7; }
  .quiz-option-label { position: relative; z-index: 1; }
  .quiz-vote-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    background: #0000000a;
    transition: width 0.65s ease;
    pointer-events: none;
  }
  .quiz-option-percent {
    position: relative;
    z-index: 1;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    white-space: nowrap;
  }
  .quiz-shell[data-phase="votes"] .quiz-option,
  .quiz-shell[data-phase="reveal"] .quiz-option,
  .quiz-shell[data-collecting="true"] .quiz-option { justify-content: space-between; padding-right: 16px; }
  .quiz-option.is-correct, .quiz-option.is-correct:disabled:hover { background: #e5f7e7; }
  .quiz-option.is-correct .quiz-vote-fill { background: #30b03d24; }
  .quiz-option.is-wrong, .quiz-option.is-wrong:disabled:hover { background: #ffe7e9; }
  .quiz-option.is-wrong .quiz-vote-fill { background: #f0303d1a; }
  .quiz-feedback { display: block; min-height: 22px; margin-bottom: 4px; color: var(--quiz-text-secondary); }
  .quiz-feedback.is-success { color: #23852d; }
  .quiz-winners { list-style: none; display: flex; flex-direction: column; width: 100%; gap: 12px; }
  .quiz-winner {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #f2f2f2;
    padding: 14px 16px;
    border-radius: 10px;
    text-align: left;
    font-size: 17px;
    font-weight: 500;
    line-height: 24px;
  }
  .quiz-winner-place {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #e5e5e5;
    flex-shrink: 0;
  }
  .quiz-winner:first-child .quiz-winner-place { background: #ffe5a0; }
  .quiz-winner:nth-child(3) .quiz-winner-place { background: #e5b58a; }
  .quiz-winner-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  .quiz-winner-name { min-width: 0; overflow-wrap: anywhere; }
  .quiz-personal-result { color: var(--quiz-text-secondary); font-size: 15px; line-height: 22px; }
  @container (max-width: 591px) {
    .quiz-option { min-height: 54px; }
    .quiz-lobby-time { font-size: 48px; line-height: 56px; }
    .quiz-winner { padding: 12px; font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .quiz-vote-fill, .quiz-option, .quiz-counter-reel { transition: none; }
  }

  /* Реакции */
  .reactions-bar {
    padding-top: 20px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .reaction {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    border-radius: 80px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 400;
    line-height: 22px;
    color: #595959;
  }

  .reaction-active {
    background: #0B5DD7;
    color: #fff;
  }

  .reaction-inactive {
    background: #F5F5F5;
  }
  .reaction-inactive:hover { background: #ebebeb; }

  .reaction-add {
    background: #F5F5F5;
    border-radius: 80px;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #595959;
  }
  .reaction-add:hover { background: #ebebeb; }

  /* Экшен-бар */
  .action-bar {
    padding: 12px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .action-left {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .action-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px 4px 0;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 56px;
    font-family: 'Roboto', sans-serif;
    font-size: 15px;
    color: #595959;
    line-height: 22px;
  }
  .action-btn:hover { background: #f4f4f4; }

  .action-icon-btn {
    width: 36px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 8px;
    padding: 4px 8px;
  }
  .action-icon-btn:hover { background: #f4f4f4; }

  .action-right {
    display: flex;
    align-items: center;
    gap: 4px;
    padding-left: 12px;
    color: #595959;
    font-size: 15px;
    line-height: 22px;
  }

  /* Адаптив */
  @media (max-width: 640px) {
    body { padding: 60px 0 0; }
    .site-header { padding: 0 16px; }
    .post-card { border-radius: 0; }
    .post-content {
      width: 100%;
      height: 592px;
    }
  }

  /* Темная тема */

  /* Плавные переходы */
  body, .site-header, .post-card, .post-title, .author-name, .author-time, .author-section,
  .btn-subscribe, .reaction-inactive, .reaction-add, .action-btn, .action-right,
  .post-content {
    transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }

  /* Страница и карточка */
  [data-theme="dark"] body { background: #18191a; }
  [data-theme="dark"] .post-card { background: #242526; }
  [data-theme="dark"] .author-name { color: #e4e6eb; }
  [data-theme="dark"] .author-section { color: #e4e6eb; }
  [data-theme="dark"] .author-time { color: #b0b3b8; }
  [data-theme="dark"] .btn-subscribe { background: #3a3b3c; color: #e4e6eb; }
  [data-theme="dark"] .btn-subscribe:hover { background: #4e4f50; }
  [data-theme="dark"] .btn-more:hover { background: #3a3b3c; }
  [data-theme="dark"] .btn-more svg circle { fill: #b0b3b8; }
  [data-theme="dark"] .post-title { color: #e4e6eb; }
  [data-theme="dark"] .post-content { background: #2d2e30; border-color: rgba(255,255,255,0.06); color: #555; }
  [data-theme="dark"] .post-content::after { border-color: rgba(255,255,255,0.06); }
  [data-theme="dark"] .quiz-shell {
    --quiz-bg: #0f0f0f;
    --quiz-text: #fff;
    --quiz-text-secondary: #a6a6a6;
    --quiz-btn-bg: #333;
    --quiz-btn-hover: #2c2c2c;
    --quiz-btn-active: #2c2c2c;
    --quiz-btn-text: #fff;
  }
  [data-theme="dark"] .avatar-badge { border-color: #242526; }

  /* Реакции и экшен-бар */
  [data-theme="dark"] .reaction { color: #b0b3b8; }
  [data-theme="dark"] .reaction-inactive { background: #3a3b3c; }
  [data-theme="dark"] .reaction-inactive:hover { background: #4e4f50; }
  [data-theme="dark"] .reaction-inactive svg path { fill: #b0b3b8; }
  [data-theme="dark"] .reaction-add { background: #3a3b3c; }
  [data-theme="dark"] .reaction-add:hover { background: #4e4f50; }
  [data-theme="dark"] .reaction-add svg path { fill: #b0b3b8; }
  [data-theme="dark"] .action-btn { color: #b0b3b8; }
  [data-theme="dark"] .action-btn:hover { background: #3a3b3c; }
  [data-theme="dark"] .action-btn svg path { fill: #b0b3b8; }
  [data-theme="dark"] .action-icon-btn:hover { background: #3a3b3c; }
  [data-theme="dark"] .action-icon-btn svg path { fill: #b0b3b8; }
  [data-theme="dark"] .action-right { color: #b0b3b8; }
  [data-theme="dark"] .action-right svg path { fill: #b0b3b8; }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-logo" aria-label="Логотип">
    <svg width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

      </defs>
    </svg>
  </div>
</header>

<main class="demo-page">
<div class="post-card">
  <div class="post-inner">

    <!-- Шапка -->
    <div class="post-header">
      <div class="author-block">
        <div class="avatar-wrap">
          <div class="avatar-main"></div>
          <div class="avatar-badge"></div>
        </div>
        <div class="author-info">
          <div class="author-name-row">

  function updateCounter(elapsed) {
    // Читаемые обновления раз в 0.8 секунды вместо смены цифр на каждом кадре.
    const step = Math.floor(elapsed / 800);
    if (step === lastLobbyStep) return;
    lastLobbyStep = step;
    const progress = Math.min(1, step * 800 / Math.max(800, durations.lobby - 200));
    const count = Math.round(128 + 622 * Math.sin(progress * Math.PI / 2));
    String(count).padStart(3, '0').split('').forEach((digit, i) => {

    overlay.classList.add('quiz-transition-overlay');

    const options = { duration: 225, easing: 'cubic-bezier(0.4, 0, 0.2, 1)' };

    ui.shell.inert = true;
    fadeOut = overlay.animate([{ opacity: 1 }, { opacity: 0 }], { ...options, fill: 'forwards' });

      if (fadeOverlay !== overlay) return;
      overlay.remove();
      fadeOverlay = null;
      // Новый экран проявляется только после полного исчезновения старого.
      const animation = ui.shell.animate([{ opacity: 0 }, { opacity: 1 }], { ...options, fill: 'forwards' });
      fadeIn = animation;
      animation.onfinish = () => {
        if (fadeIn !== animation) return;
        ui.shell.style.opacity = '';
        ui.shell.inert = false;
        animation.cancel();
        fadeIn = null;

    };

      button.addEventListener('click', () => selectAnswer(index));
      ui.options.append(button);
      return { button, fill, percent };
    });
  }

  function selectAnswer(index) {
    const now = performance.now();
    if (phase !== 'answer' || answers[questionIndex] !== null || now - phaseStartedAt >= durations.answer) return;
    answers[questionIndex] = index;
    optionNodes.forEach((node, i) => {
      node.button.disabled = true;
      node.button.classList.toggle('is-selected', i === index);
      node.button.setAttribute('aria-pressed', String(i === index));
    });
    ui.feedback.textContent = 'Ответ принят';
    ui.shell.dataset.collecting = 'true';
    lastSeconds = -1;
    update(now);
  }

  function setVotePercentages(elapsed) {
    // Каждые полсекунды интерполируем заданные кадры; сумма всегда ровно 100%.
    const totalSteps = collectionWindow / 500;
    const step = Math.min(totalSteps, Math.max(0, Math.floor(elapsed / 500)));
    if (step === lastVoteStep) return;
    lastVoteStep = step;
    const frames = questions[questionIndex].votes;
    const position = step / totalSteps * (frames.length - 1);
    const left = Math.min(Math.floor(position), frames.length - 1);
    const right = Math.min(left + 1, frames.length - 1);
    const fraction = position - left;
    const raw = frames[left].map((value, i) => value + (frames[right][i] - value) * fraction);
    const values = raw.map(Math.floor);
    const order = raw.map((value, i) => ({ i, remainder: value - values[i] })).sort((a, b) => b.remainder - a.remainder || a.i - b.i);
    const missing = 100 - values.reduce((sum, value) => sum + value, 0);
    for (let i = 0; i < missing; i++) values[order[i].i]++;
    optionNodes.forEach((node, i) => {
      node.fill.hidden = false;
      node.percent.hidden = false;
      node.fill.style.width = `${values[i]}%`;
      node.percent.textContent = `${values[i]}%`;
    });
  }

  function enterPhase(nextPhase, startAt) {
    if (nextPhase === 'reveal') clearFade();
    else fadeScreen(startAt);
    phase = nextPhase;
    phaseStartedAt = startAt;
    lastSeconds = -1;
    ui.shell.dataset.phase = phase;
    ui.shell.dataset.collecting = 'false';
    ui.lobby.hidden = phase !== 'lobby';
    ui.round.hidden = phase === 'lobby' || phase === 'finished';
    ui.finale.hidden = phase !== 'finished';
    ui.feedback.classList.remove('is-success');
    if (phase === 'answer') {
      roundStartedAt = startAt;
      renderOptions();
      ui.feedback.textContent = 'Выберите ответ';
    } else if (phase === 'votes') {
      optionNodes.forEach(node => { node.button.disabled = true; });
      ui.feedback.textContent = 'Как ответили игроки';
      lastVoteStep = -1;
      setVotePercentages(answerWindow);
    } else if (phase === 'reveal') {
      setVotePercentages(collectionWindow);
      const correct = questions[questionIndex].correct;
      optionNodes.forEach((node, i) => {
        node.button.classList.toggle('is-correct', i === correct);
        node.button.classList.toggle('is-wrong', answers[questionIndex] === i && i !== correct);
      });
      ui.feedback.textContent = 'Правильный ответ';
      ui.feedback.classList.add('is-success');
    } else if (phase === 'finished') {
      const correctCount = questions.filter((question, i) => answers[i] === question.correct).length;
      ui.result.textContent = `Ваш результат: ${correctCount} из ${questions.length}`;
    }
  }

  function advance(startAt) {
    if (phase === 'lobby') enterPhase('answer', startAt);
    else if (phase === 'answer') enterPhase(durations.votes > 0 ? 'votes' : 'reveal', startAt);
    else if (phase === 'votes') enterPhase('reveal', startAt);
    else if (phase === 'reveal') {
      questionIndex++;
      enterPhase(questionIndex < questions.length ? 'answer' : 'finished', startAt);
    }
  }

  function update(now) {
    const clock = now;
    // Учитываем пропущенные кадры и фоновые вкладки без удлинения этапов.
    while (phase !== 'finished' && clock - phaseStartedAt >= durations[phase]) {
      advance(phaseStartedAt + durations[phase]);
    }
    if (phase === 'finished') return;
    const elapsed = Math.max(0, clock - phaseStartedAt);
    const collecting = phase === 'votes' || (phase === 'answer' && answers[questionIndex] !== null);
    const timerElapsed = collecting ? Math.max(0, clock - roundStartedAt) : elapsed;
    const timerDuration = collecting ? collectionWindow : durations[phase];
    const seconds = Math.ceil(Math.max(0, timerDuration - timerElapsed) / 1000);
    if (seconds !== lastSeconds) {
      lastSeconds = seconds;
      if (phase === 'lobby') ui.lobbyTime.textContent = formatTime(seconds);
      else ui.time.textContent = formatTime(seconds);
    }
    if (phase === 'lobby') {
      updateCounter(elapsed);
    } else {
      ui.progress.style.transform = `scaleX(${Math.max(0, 1 - timerElapsed / timerDuration)})`;
      const ratio = timerElapsed / timerDuration;
      ui.progress.style.background = collecting || phase !== 'answer' ? '#0b5dd7' : ratio < 0.55 ? '#30b03d' : ratio < 0.8 ? '#fbb452' : '#f0303d';
      if (collecting) setVotePercentages(timerElapsed);
    }
  }

  function tick(now) {
    update(now);
    if (phase !== 'finished') frameId = requestAnimationFrame(tick);
  }

  function restart() {
    cancelAnimationFrame(frameId);
    questionIndex = 0;
    answers = questions.map(() => null);
    lastVoteStep = -1;
    clearFade();
    resetCounter();
    phase = null;
    ui.options.replaceChildren();
    optionNodes = [];
    ui.players.textContent = '750 игроков';
    const now = performance.now();
    enterPhase('lobby', now);
    update(now);
    frameId = requestAnimationFrame(tick);
  }

  restart();
})();
</script>

</body>
</html>
