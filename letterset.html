<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vc.ru Card Template</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #edeef0;
    font-family: 'Roboto', sans-serif;
    display: flex;
    justify-content: center;
    padding: 84px 16px 24px;
  }

  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 10;
    width: 100%;
    height: 60px;
    background: #FFE5EA;
    display: flex;
    align-items: center;
    padding: 0 24px;
  }

  .site-logo {
    display: flex;
    align-items: center;
    width: 52px;
    height: 52px;
  }

  /* Карточка */
  .post-card {
    width: 640px;
    max-width: 100%;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
  }

  .post-inner {
    padding: 0 24px;
  }

  /* Шапка */
  .post-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0 12px;
  }

  .author-block {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Аватар с градиентом */
  .avatar-wrap {
    position: relative;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
  }

  .avatar-main {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: conic-gradient(
      from 90deg,
      #6ed0ff 0deg,
      #61a1ff 42deg,
      #9d70ff 89deg,
      #ff60c7 137deg,
      #ff483e 180deg,
      #ff9400 223deg,
      #ffde48 270deg,
      #7ae632 306deg,
      #6fd1ff 359deg,
      #6ed0ff 360deg
    );
    outline: 1px solid rgba(0,0,0,0.10);
    outline-offset: -1px;
  }

  /* vc.ru-бейдж */
  .avatar-badge {
    position: absolute;
    bottom: -2px;
    right: -4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #1693E5;
    border: 2px solid #fff;
  }

  .author-info {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .author-name-row {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .author-name {
    font-size: 15px;
    font-weight: 500;
    color: #000;
    line-height: 22px;
  }

  .author-name-badge {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .author-name-badge-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .reaction-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  .reaction-icon-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }


  .author-meta {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .author-section {
    font-size: 13px;
    font-weight: 400;
    color: #000;
    line-height: 18px;
  }

  .author-time {
    font-size: 13px;
    color: #595959;
    line-height: 18px;
  }

  /* Кнопки справа */
  .header-actions {
    display: flex;
    align-items: center;
  }

  .btn-subscribe {
    font-family: 'Roboto', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #000;
    background: #F4F4F4;
    border: none;
    border-radius: 8px;
    padding: 5px 10px;
    height: 28px;
    cursor: pointer;
    line-height: 18px;
  }
  .btn-subscribe:hover { background: #e8e8e8; }

  .btn-more {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 50%;
    padding: 9px 8px;
  }
  .btn-more:hover { background: #f4f4f4; }

  /* Заголовок */
  .post-title-row {
    padding-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .post-title {
    font-size: 22px;
    font-weight: 500;
    color: #000;
    line-height: 30px;
  }

  /* Контент-блок */
  .post-content {
    width: 592px;
    height: 592px;
    background: #fff;
    border-radius: 10px;
    border: 1px solid rgba(0,0,0,0.10);
    margin-bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #bbb;
    font-size: 14px;
  }

  .game-placeholder {
    width: 100%;
    height: 100%;
  }

  .letterset-game {
    --ink: #111111;
    --paper: #f2f4f6;
    --panel: #ffffff;
    --blue: #2d84ff;
    --blue-dark: #1764d8;
    --yellow: #ffd62e;
    --red: #ff4b58;
    --green: #44b84d;
    --pink: #ffd8e7;
    --mint: #dff8ec;
    --cyan: #dff4ff;
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    color: var(--ink);
    background-color: var(--paper);
    background-image: radial-gradient(rgba(17,17,17,0.18) 1px, transparent 1px);
    background-size: 16px 16px;
    border-radius: 10px;
    padding: 16px;
    font-family: 'Roboto', sans-serif;
    user-select: none;
  }

  .letterset-game button {
    font-family: inherit;
  }

  .game-shell {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-rows: auto auto auto 1fr auto;
    gap: 12px;
  }

  .game-top {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 10px;
  }

  .game-title,
  .game-stat {
    min-height: 46px;
    border: 4px solid var(--ink);
    border-radius: 12px;
    background: var(--panel);
    box-shadow: 5px 5px 0 var(--ink);
    display: flex;
    align-items: center;
  }

  .game-title {
    padding: 6px 12px;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
  }

  .game-kicker {
    font-size: 10px;
    line-height: 1;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0;
  }

  .game-name {
    font-size: 20px;
    line-height: 22px;
    font-weight: 900;
  }

  .game-stat {
    min-width: 108px;
    padding: 5px 10px;
    justify-content: space-between;
    gap: 8px;
  }

  .game-stat-label {
    font-size: 10px;
    line-height: 12px;
    font-weight: 900;
    text-transform: uppercase;
  }

  .game-stat-value {
    font-size: 22px;
    line-height: 22px;
    font-weight: 900;
  }

  .word-slots {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }

  .word-slot {
    position: relative;
    height: 50px;
    border: 3px dashed rgba(17,17,17,0.42);
    border-radius: 10px;
    background: rgba(255,255,255,0.68);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    line-height: 1;
    font-weight: 900;
  }

  .word-slot.has-letter {
    border-style: solid;
    border-color: var(--ink);
    background: var(--blue);
    box-shadow: 4px 4px 0 var(--ink);
    color: #ffffff;
    cursor: pointer;
  }

  .word-slot-letter {
    position: relative;
    z-index: 1;
  }

  .word-slot-value {
    position: absolute;
    right: 6px;
    bottom: 5px;
    z-index: 1;
    font-size: 10px;
    line-height: 10px;
    font-weight: 900;
  }

  .power-badge {
    position: static;
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 8px;
    background: transparent;
    font-size: 17px;
    line-height: 1;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .power-word {
    color: #d83f93;
  }

  .power-letter {
    color: #168fc8;
  }

  .word-slot.has-power {
    border-color: currentColor;
  }

  .word-slot.has-power-shift {
    color: #22a763;
    background: linear-gradient(#dff8ec99, #dff8ec99);
  }

  .word-slot.has-power-word {
    color: #d83f93;
    background: linear-gradient(#ffd8e799, #ffd8e799);
  }

  .word-slot.has-power-letter {
    color: #168fc8;
    background: linear-gradient(#dff4ff99, #dff4ff99);
  }

  .word-slot.has-letter .power-badge {
    display: none;
  }

  .game-message {
    min-height: 44px;
    border: 4px solid var(--ink);
    border-radius: 12px;
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 12px;
    text-align: center;
    font-size: 15px;
    line-height: 18px;
    font-weight: 900;
  }

  .tile-grid-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }

  .tile-grid {
    display: grid;
    grid-template-columns: repeat(3, 72px);
    grid-template-rows: repeat(3, 72px);
    gap: 10px;
  }

  .letter-tile {
    position: relative;
    border: 4px solid var(--ink);
    border-radius: 12px;
    background: var(--blue);
    box-shadow: 5px 5px 0 var(--ink);
    color: #ffffff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    line-height: 1;
    font-weight: 900;
    text-transform: uppercase;
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
  }

  .letter-tile:hover,
  .letter-tile:focus-visible {
    transform: translate(-1px, -1px);
    box-shadow: 6px 6px 0 var(--ink);
    outline: none;
  }

  .letter-tile.is-selected {
    transform: translate(4px, 4px);
    box-shadow: 1px 1px 0 var(--ink);
    filter: saturate(0.85);
  }

  .letter-tile.is-empty {
    background: #ffffff;
    box-shadow: none;
    color: transparent;
    pointer-events: none;
  }

  .letter-tile.is-vacated {
    background: #ffffff;
    box-shadow: 3px 3px 0 var(--ink);
    color: transparent;
  }

  .letter-tile.is-vacated:hover,
  .letter-tile.is-vacated:focus-visible {
    transform: none;
    box-shadow: 3px 3px 0 var(--ink);
  }

  .letter-tile.is-empty .letter-value,
  .letter-tile.is-vacated .letter-value {
    display: none;
  }

  .letter-value {
    position: absolute;
    right: 7px;
    bottom: 6px;
    font-size: 12px;
    line-height: 12px;
    font-weight: 900;
  }

  .game-actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1.25fr;
    gap: 10px;
  }

  .game-action {
    height: 46px;
    border: 4px solid var(--ink);
    border-radius: 14px;
    box-shadow: 5px 5px 0 var(--ink);
    color: #ffffff;
    cursor: pointer;
    font-size: 26px;
    line-height: 1;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  .game-action:hover,
  .game-action:focus-visible {
    transform: translate(-1px, -1px);
    box-shadow: 6px 6px 0 var(--ink);
    outline: none;
  }

  .game-action:active {
    transform: translate(4px, 4px);
    box-shadow: 1px 1px 0 var(--ink);
  }

  .action-clear { background: var(--red); }
  .action-shuffle { background: var(--yellow); color: var(--ink); }
  .action-submit { background: var(--green); }

  .game-reset {
    margin-left: 10px;
    border: 3px solid var(--ink);
    border-radius: 10px;
    background: var(--yellow);
    color: var(--ink);
    padding: 5px 10px;
    font-size: 12px;
    line-height: 14px;
    font-weight: 900;
    cursor: pointer;
  }

  .morph-modal {
    position: absolute;
    inset: 0;
    z-index: 3;
    background: rgba(17,17,17,0.36);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
  }

  .morph-modal.is-open {
    display: flex;
  }

  .morph-panel {
    width: min(420px, 100%);
    border: 4px solid var(--ink);
    border-radius: 14px;
    background: var(--panel);
    box-shadow: 7px 7px 0 var(--ink);
    padding: 14px;
  }

  .morph-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .morph-title {
    font-size: 16px;
    line-height: 18px;
    font-weight: 900;
  }

  .morph-close {
    width: 34px;
    height: 34px;
    border: 3px solid var(--ink);
    border-radius: 10px;
    background: var(--red);
    color: #ffffff;
    font-size: 19px;
    line-height: 1;
    font-weight: 900;
    cursor: pointer;
  }

  .morph-letters {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
  }

  .morph-letter {
    height: 34px;
    border: 3px solid var(--ink);
    border-radius: 8px;
    background: var(--blue);
    color: #ffffff;
    cursor: pointer;
    font-size: 17px;
    line-height: 1;
    font-weight: 900;
  }

  .letter-tile.is-popping {
    animation: letterset-tile-pop 260ms cubic-bezier(.2, 1.45, .35, 1) both;
  }

  .word-slot.is-popping {
    animation: letterset-slot-pop 220ms cubic-bezier(.2, 1.35, .38, 1) both;
  }

  .power-badge.is-popping {
    animation: letterset-bonus-pop 260ms cubic-bezier(.18, 1.45, .3, 1) both;
  }

  .game-message.is-success {
    animation: letterset-submit-success 780ms ease both;
  }

  .game-message.is-error {
    animation: letterset-submit-error 520ms ease both;
  }

  .game-stat-value.is-rolling {
    animation: letterset-counter-roll 220ms ease both;
  }

  .game-stat-value.is-bumping {
    animation: letterset-counter-bump 360ms cubic-bezier(.2, 1.45, .35, 1) both;
  }

  @keyframes letterset-tile-pop {
    0% { transform: scale(0.72) rotate(-3deg); opacity: 0; }
    62% { transform: scale(1.12) rotate(1deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  @keyframes letterset-slot-pop {
    0% { transform: scale(0.84) translateY(4px); }
    65% { transform: scale(1.08) translateY(-1px); }
    100% { transform: scale(1) translateY(0); }
  }

  @keyframes letterset-bonus-pop {
    0% { transform: scale(0.2) rotate(-12deg); opacity: 0; }
    62% { transform: scale(1.22) rotate(4deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  @keyframes letterset-submit-success {
    0% { background: var(--panel); color: var(--ink); transform: scale(1); }
    12% { background: #22c55e; color: #ffffff; transform: scale(1.035); }
    64% { background: #22c55e; color: #ffffff; transform: scale(1); }
    100% { background: var(--panel); color: var(--ink); transform: scale(1); }
  }

  @keyframes letterset-submit-error {
    0%, 100% { transform: translateX(0); background: var(--panel); color: var(--ink); }
    12% { transform: translateX(-8px); background: #ef4444; color: #ffffff; }
    24% { transform: translateX(7px); }
    36% { transform: translateX(-5px); }
    48% { transform: translateX(4px); }
    62% { transform: translateX(-2px); background: #ef4444; color: #ffffff; }
  }

  @keyframes letterset-counter-roll {
    0% { transform: translateY(55%); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }

  @keyframes letterset-counter-bump {
    0% { transform: scale(1); }
    45% { transform: scale(1.24); }
    100% { transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .letter-tile,
    .game-action {
      transition: none;
    }

    .letter-tile.is-popping,
    .word-slot.is-popping,
    .power-badge.is-popping,
    .game-message.is-success,
    .game-message.is-error,
    .game-stat-value.is-rolling,
    .game-stat-value.is-bumping {
      animation: none;
    }
  }

  @media (max-width: 640px) {
    .letterset-game {
      padding: 10px;
    }

    .game-shell {
      gap: 8px;
    }

    .game-top {
      grid-template-columns: 1fr 82px 82px;
      gap: 6px;
    }

    .game-title,
    .game-stat {
      min-height: 40px;
      border-width: 3px;
      box-shadow: 4px 4px 0 var(--ink);
    }

    .game-name {
      font-size: 16px;
      line-height: 18px;
    }

    .game-stat {
      min-width: 0;
      padding: 4px 7px;
    }

    .game-stat-label {
      font-size: 8px;
      line-height: 10px;
    }

    .game-stat-value {
      font-size: 17px;
      line-height: 18px;
    }

    .word-slots {
      gap: 5px;
    }

    .word-slot {
      height: 40px;
      border-width: 2px;
      font-size: 20px;
    }

    .power-badge {
      top: -9px;
      right: -6px;
      min-width: 23px;
      height: 18px;
      font-size: 9px;
      line-height: 11px;
    }

    .game-message {
      min-height: 36px;
      border-width: 3px;
      font-size: 12px;
      line-height: 14px;
    }

    .tile-grid {
      grid-template-columns: repeat(3, minmax(0, 62px));
      grid-template-rows: repeat(3, minmax(0, 62px));
      gap: 7px;
    }

    .letter-tile {
      border-width: 3px;
      font-size: 30px;
      box-shadow: 4px 4px 0 var(--ink);
    }

    .game-action {
      height: 40px;
      border-width: 3px;
      font-size: 22px;
      box-shadow: 4px 4px 0 var(--ink);
    }

    .morph-letters {
      grid-template-columns: repeat(6, 1fr);
    }
  }

  .post-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Реакции */
  .reactions-bar {
    padding-top: 20px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .reaction {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    border-radius: 80px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 400;
    line-height: 22px;
    color: #595959;
  }

  .reaction-active {
    background: #0B5DD7;
    color: #fff;
  }

  .reaction-inactive {
    background: #F5F5F5;
  }
  .reaction-inactive:hover { background: #ebebeb; }

  .reaction-add {
    background: #F5F5F5;
    border-radius: 80px;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #595959;
  }
  .reaction-add:hover { background: #ebebeb; }

  /* Экшен-бар */
  .action-bar {
    padding: 12px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .action-left {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .action-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px 4px 0;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 56px;
    font-family: 'Roboto', sans-serif;
    font-size: 15px;
    color: #595959;
    line-height: 22px;
  }
  .action-btn:hover { background: #f4f4f4; }

  .action-icon-btn {
    width: 36px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 8px;
    padding: 4px 8px;
  }
  .action-icon-btn:hover { background: #f4f4f4; }

  .action-right {
    display: flex;
    align-items: center;
    gap: 4px;
    padding-left: 12px;
    color: #595959;
    font-size: 15px;
    line-height: 22px;
  }

  /* Адаптив */
  @media (max-width: 640px) {
    body { padding: 60px 0 0; }
    .site-header { padding: 0 16px; }
    .post-card { border-radius: 0; }
    .post-content {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      min-height: 0;
    }
  }

  /* Темная тема */

  /* Плавные переходы */
  body, .site-header, .post-card, .post-title, .author-name, .author-time, .author-section,
  .btn-subscribe, .reaction-inactive, .reaction-add, .action-btn, .action-right,
  .post-content {
    transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }

  /* Страница и карточка */
  [data-theme="dark"] body { background: #18191a; }
  [data-theme="dark"] .post-card { background: #242526; }
  [data-theme="dark"] .author-name { color: #e4e6eb; }

    function clonePowerUp(powerUp, index) {

        nextPowerUpIndex += 1;
        if (!powerUp) continue;

        const index = findNextAvailablePowerSlot(powerUp.index);
        if (index === null) continue;

        activePowerUps[index] = clonePowerUp(powerUp, index);
        revealed.push(index);
        assigned += 1;

    function rollScore(from, to) {
      clearScoreRollTimers();

      if (from === to) {
        nodes.score.textContent = to;
        return;
      }

      const direction = to > from ? 1 : -1;
      const distance = Math.abs(to - from);
      const step = Math.max(1, Math.ceil(distance / 18));
      let current = from;

      const tick = () => {
        current += direction * step;
        if ((direction > 0 && current >= to) || (direction < 0 && current <= to)) {
          current = to;
        }

        nodes.score.textContent = current;
        restartAnimation(nodes.score, 'is-rolling');

        if (current !== to) {
          scoreRollTimeoutIds.push(window.setTimeout(tick, 36));
        } else {
          scoreRollTimeoutIds.push(window.setTimeout(() => {
            nodes.score.classList.remove('is-rolling');
            restartAnimation(nodes.score, 'is-bumping');
          }, 40));
        }
      };

      tick();
    }

      if (last === 1) {

      if (last >= 2 && last <= 4) {

        delete activePowerUps[index];
        consumedCount += 1;

    function submitWord() {

      const word = currentWord();
      const normalized = normalizeWord(word);

      if (word.length < 3) {
        setMessage('Нужно минимум 3 буквы');
        setMessageTone('error');
        return;
      }

      if (!dictionary.has(normalized)) {
        setMessage(`«${word}» нет в словаре`);
        setMessageTone('error');
        return;
      }

      if (playedWords.has(normalized)) {
        setMessage(`«${word}» уже было`);
        setMessageTone('error');
        return;
      }

      const previousScore = score;
      const gained = scoreCurrentWord();
      playedWords.add(normalized);
      score += gained;
      const revealedPowerIndices = consumeCoveredPowerUps(word.length);
      removeSelectedTiles();
      const refilledTileIds = refillBoard();
      selectedIds = [];

        isFinished = true;

      } else {
        setMessage(`«${word}» +${gained}`);

      markPoppingTiles(refilledTileIds);
      markPoppingPowers(revealedPowerIndices);

    function shuffleArray(items) {
      const shuffled = items.slice();
      for (let index = shuffled.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
      }
      return shuffled;
    }

    function boardHasPlayableWord(nextBoard) {
      const counts = nextBoard.reduce((map, tile) => {
        if (!tile) return map;
        const letter = normalizeWord(tile.letter);
        map[letter] = (map[letter] ?? 0) + 1;
        return map;
      }, {});

      for (const word of dictionary) {
        if (playedWords.has(word)) continue;
        const needed = {};
        let canMake = true;

        for (const letter of word) {
          needed[letter] = (needed[letter] ?? 0) + 1;
          if (needed[letter] > (counts[letter] ?? 0)) {
            canMake = false;
            break;
          }
        }

        if (canMake) {
          return true;
        }
      }

      return false;
    }

    function randomRefillAttempt() {
      const nextBoard = board.slice();
      const nextQueue = queue.slice();
      const refilledTileIds = [];
      const emptySlots = nextBoard
        .map((tile, index) => tile ? null : index)
        .filter((index) => index !== null);

      for (const slotIndex of emptySlots) {
        if (nextQueue.length === 0) break;
        const queueIndex = Math.floor(Math.random() * nextQueue.length);
        const [nextTile] = nextQueue.splice(queueIndex, 1);
        nextBoard[slotIndex] = nextTile;
        refilledTileIds.push(nextTile.id);
      }

      return { nextBoard, nextQueue, refilledTileIds };
    }

    function refillBoard() {
      const emptyCount = board.filter((tile) => !tile).length;
      if (emptyCount === 0 || queue.length === 0) {
        return [];
      }

      const attempts = Math.min(120, Math.max(24, queue.length * emptyCount * 2));
      let fallback = null;

      for (let attempt = 0; attempt < attempts; attempt += 1) {
        const refill = randomRefillAttempt();
        fallback ??= refill;

        const remainingLetters = refill.nextBoard.filter(Boolean).length + refill.nextQueue.length;
        if (remainingLetters === 0 || boardHasPlayableWord(refill.nextBoard)) {
          board = refill.nextBoard;
          queue = refill.nextQueue;
          return refill.refilledTileIds;
        }
      }

      const refill = fallback ?? randomRefillAttempt();
      board = refill.nextBoard;
      queue = refill.nextQueue;
      return refill.refilledTileIds;
    }

    function clearWord() {
      selectedTiles().forEach((tile) => {
        if (tile.letter === '?') {
          tile.morphChoice = null;
        }
      });
      selectedIds = [];
      setMessage('Длиннее слово — больше очков');
      setMessageTone(null);

    function shuffleGrid() {
      if (isFinished) return;
      clearWord();
      const filled = board.filter(Boolean);

      for (let index = filled.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [filled[index], filled[swapIndex]] = [filled[swapIndex], filled[index]];
      }

      let filledIndex = 0;
      board = board.map((tile) => tile ? filled[filledIndex++] : null);
      setMessage('Буквы перемешаны');
      render();
      markPoppingTiles(board.filter(Boolean).map((tile) => tile.id));
    }

    nodes.clear.addEventListener('click', clearWord);
    nodes.shuffle.addEventListener('click', shuffleGrid);
    nodes.submit.addEventListener('click', submitWord);
    nodes.morphClose.addEventListener('click', closeMorphModal);
    nodes.morphModal.addEventListener('click', (event) => {
      if (event.target === nodes.morphModal) {
        closeMorphModal();
      }
    });

    renderMorphLetters();
    resetGame();
  })();

  // Переключение темы
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? '' : 'dark');
  });

  function isSupportedBadgeImage(file) {
    const extension = file.name.split('.').pop().toLowerCase();
    return file.type.startsWith('image/') || supportedBadgeExtensions.includes(extension);
  }

  function showBadgeUploadAlert() {
    alert(badgeUploadMessage);
  }

  function replaceImageContent(container, src, className) {
    container.innerHTML = '';

    const image = document.createElement('img');
    image.className = className;
    image.src = src;
    image.alt = '';

    container.appendChild(image);
  }

  document.addEventListener('dragover', (event) => {
    event.preventDefault();
  });

  document.addEventListener('drop', (event) => {
    event.preventDefault();

    const file = event.dataTransfer.files[0];
    if (!file || !isSupportedBadgeImage(file)) {
      showBadgeUploadAlert();
      return;
    }

    const reader = new FileReader();

    reader.addEventListener('load', () => {
      const badge = document.querySelector('.author-name-badge');
      const fireIcon = document.querySelector('.reaction-fire-icon');

      replaceImageContent(badge, reader.result, 'author-name-badge-image');
      replaceImageContent(fireIcon, reader.result, 'reaction-icon-image');
    });

    reader.addEventListener('error', showBadgeUploadAlert);
    reader.readAsDataURL(file);
  });
</script>

</body>
</html>
